name: Run Minecraft AFK Bot 24/7

on:
  push:
    branches: [ "main" ]
  schedule:
    # Har 5 hrs me workflow restart hoga taaki GitHub timeout limit hit na ho
    - cron: "0 */5 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Bot
        run: node index.js
